modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "thelionking.mixins.json"

[[dependencies.thelionking]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.thelionking]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.thelionking]]
modId = "geckolib"
mandatory = true
versionRange = "[4.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.thelionking]]
modId = "jei"
mandatory = false
versionRange = "[15,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.thelionking]]
modId = "jade"
mandatory = false
versionRange = "[11,)"
ordering = "AFTER"
side = "CLIENT"
