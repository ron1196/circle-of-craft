modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "${mod_issue_url}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_display_url}"
logoFile = "banner/banner.png"
credits = "${mod_credits}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "circleofcraft.mixins.json"

[[dependencies.circleofcraft]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.circleofcraft]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.circleofcraft]]
modId = "geckolib"
mandatory = true
versionRange = "[4.8,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.circleofcraft]]
modId = "jei"
mandatory = false
versionRange = "[15.20,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.circleofcraft]]
modId = "jade"
mandatory = false
versionRange = "[11.6,)"
ordering = "AFTER"
side = "CLIENT"
