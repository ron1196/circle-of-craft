plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = System.getenv('MOD_VERSION') ?: '0.0.0-dev'
group = 'io.github.ron1196'

base {
    archivesName = 'circleofcraft'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// NeoForge ships official (Mojmap) names that match the dev environment, so
// mixins need no refmap and no SRG/notch remapping. The SpongePowered AP still
// registers the legacy MCP obfuscation environments and treats a missing
// obf-mapping for an injector target as a fatal error. With no SRG/notch
// mapping files present, that lookup always fails. Downgrade those diagnostics
// to notes so the AP can still validate targets without demanding obf data.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-AMSG_NO_OBFDATA_FOR_TARGET=note',
        '-AMSG_NO_OBFDATA_FOR_METHOD=note',
        '-AMSG_NO_OBFDATA_FOR_FIELD=note',
        '-AMSG_NO_OBFDATA_FOR_CLASS=note',
        '-AMSG_NO_OBFDATA_FOR_CTOR=note',
        '-Xmaxerrs', '100000'
    ]
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'circleofcraft'
    }

    client2 {
        configure runs.client
        programArguments.addAll '--username', 'Dev2'
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'circleofcraft'
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', 'circleofcraft'
    }

    clientData {
        programArguments.addAll '--mod', 'circleofcraft', '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath()
    }

    serverData {
        programArguments.addAll '--mod', 'circleofcraft', '--all',
            '--output', file('src/generated/resources/').getAbsolutePath(),
            '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.geckolib")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

repositories {
    mavenCentral()
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

repositories {
    maven {
        name = 'Curse Maven (Jade)'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation 'com.geckolib:geckolib-neoforge-26.1.2:5.5.2'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras: provides @WrapOperation and friends. NeoForge bundles
    // MixinExtras at runtime, so we only need the common variant for compile.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'

    compileOnly 'mezz.jei:jei-26.1.2-neoforge-api:29.21.0.66'
    runtimeOnly 'mezz.jei:jei-26.1.2-neoforge:29.21.0.66'
    compileOnly 'maven.modrinth:jade:26.1.8+neoforge'
    runtimeOnly 'maven.modrinth:jade:26.1.8+neoforge'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    archiveClassifier = "mc${minecraft_version}"
    manifest {
        attributes([
            'Specification-Title'     : 'circleofcraft',
            'Specification-Vendor'    : 'ron1196',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'ron1196',
            'MixinConfigs'            : 'circleofcraft.mixins.json'
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            "minecraft_version"      : minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "neo_version"            : neo_version,
            "neo_version_range"      : neo_version_range,
            "loader_version_range"   : loader_version_range,
            "mod_id"                 : "circleofcraft",
            "mod_name"               : "Circle of Craft",
            "mod_license"            : "GPL-3.0-or-later",
            "mod_version"            : project.version,
            "mod_authors"            : "ron1196",
            "mod_description"        : "Circle of Craft is a massive total conversion inspired by The Lion King: explore new dimensions, befriend and battle savanna wildlife, and follow a story-driven questline to reclaim the Pride Lands.",
            "mod_credits"            : "Original Lion King Mod by redrosewarrior1.",
            "mod_display_url"        : "https://github.com/ron1196/circle-of-craft",
            "mod_issue_url"          : "https://github.com/ron1196/circle-of-craft/issues"
    ]
    inputs.properties(replaceProperties)

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        palantirJavaFormat('2.39.0')
        importOrder()
        removeUnusedImports()
    }
}
