plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = System.getenv('MOD_VERSION') ?: '0.0.0-dev'
group = 'io.github.ron1196'

base {
    archivesName = 'circleofcraft'
}

tasks.named('jarJar').configure {
    archiveClassifier = "mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                circleofcraft {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'circleofcraft'
        }

        client2 {
            parent runs.client
            workingDirectory project.file('runs/client2')
            args '--username', 'Dev2'
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'circleofcraft'
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', 'circleofcraft'
            mods {
                circleofcraft {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', 'circleofcraft', '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

repositories {
    mavenCentral()
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

repositories {
    maven {
        name = 'Curse Maven (Jade)'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.8.3')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // MixinExtras: provides @WrapOperation and friends. Forge 1.20.1 does not
    // bundle it, so we ship the forge variant via JarInJar (production) and
    // add it to the dev runtime classpath as well.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.3.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.3.5'
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.3.5')) {
        jarJar.ranged(it, '[0.3.5,0.4.0)')
    }
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.105')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.105')
    runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.20.0.105')
    compileOnly fg.deobf('curse.maven:jade-324717:6855440')
    runtimeOnly fg.deobf('curse.maven:jade-324717:6855440')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'circleofcraft',
            'Specification-Vendor'    : 'ron1196',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'ron1196',
            'MixinConfigs'            : 'circleofcraft.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            "minecraft_version"      : minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "forge_version"          : forge_version,
            "forge_version_range"    : forge_version_range,
            "loader_version_range"   : loader_version_range,
            "mod_id"                 : "circleofcraft",
            "mod_name"               : "Circle of Craft",
            "mod_license"            : "GPL-3.0-or-later",
            "mod_version"            : project.version,
            "mod_authors"            : "ron1196",
            "mod_description"        : "Circle of Craft is a massive total conversion inspired by The Lion King: explore new dimensions, befriend and battle savanna wildlife, and follow a story-driven questline to reclaim the Pride Lands.",
            "mod_credits"            : "Original Lion King Mod by redrosewarrior1.",
            "mod_display_url"        : "https://github.com/ron1196/circle-of-craft",
            "mod_issue_url"          : "https://github.com/ron1196/circle-of-craft/issues"
    ]
    inputs.properties(replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava').configure {
    options.compilerArgs += [
        "-AoutRefMapFile=${layout.buildDirectory.file('resources/main/circleofcraft.refmap.json').get().asFile.absolutePath}"
    ]
}

spotless {
    java {
        target 'src/main/java/**/*.java'
        palantirJavaFormat('2.39.0')
        importOrder()
        removeUnusedImports()
    }
}
